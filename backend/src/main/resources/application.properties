spring.application.name=foodie
app.version=@project.version@
server.port=${SERVER_PORT}
api.prefix=${API_PREFIX}
frontend.url=${FRONTEND_URL}


# ===============================
# JWT Configuration
# ===============================
jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}

jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# true o production (HTTPS) - false khi chay dev tren http://localhost
cookie.secure=${COOKIE_SECURE:false}


# ===============================
# Admin Configuration
# ===============================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.full-name=${ADMIN_FULL_NAME}
app.admin.phone-number=${ADMIN_PHONE_NUMBER}


# ===============================
# Spring Security Configuration
# ===============================
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}


# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# ===============================
# Flyway Configuration
# ===============================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


# ===============================
# Jackson Configuration
# ===============================
# Cho phep frontend gui enum khong phan biet viet hoa viet thuong
spring.jackson.mapper.accept_case_insensitive_enums=true